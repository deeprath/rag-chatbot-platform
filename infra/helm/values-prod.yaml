# Illustrative overrides for a real cloud deployment: `helm install ... -f values.yaml -f values-prod.yaml`
#
# This is a sketch, not a drop-in — a real production setup should go further
# than these overrides and actually swap the templates/timescaledb,
# templates/minio, and templates/keycloak resources for managed equivalents
# (Timescale Cloud/RDS, S3, a managed Keycloak/Auth0/etc.) rather than running
# a single-replica StatefulSet/Deployment of each as this chart does. Treat
# this file as "what changes about the app tier," not "what makes this
# production-ready."

image:
  pullPolicy: Always

ingress:
  className: nginx
  host: app.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    - hosts: ["app.example.com"]
      secretName: rag-chatbot-tls

backend:
  image:
    repository: ghcr.io/your-org/rag-chatbot-backend
    tag: "" # set via --set backend.image.tag=$(git rev-parse --short HEAD) in CI
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1.5Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  env:
    environment: prod
    debug: "false"
    corsAllowOrigins: '["https://app.example.com"]'

frontend:
  image:
    repository: ghcr.io/your-org/rag-chatbot-frontend
    tag: ""
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

kong:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

keycloak:
  host: auth.example.com
  publicUrl: https://auth.example.com
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1.5Gi

# Real secrets belong in a proper secret manager (cloud provider's, Vault,
# External Secrets Operator, Sealed Secrets) wired to create the same Secret
# this chart expects (see templates/secrets.yaml) — not committed here, and
# not passed via a plaintext --set in a CI log either.
