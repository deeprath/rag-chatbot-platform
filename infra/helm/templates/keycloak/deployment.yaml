apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-chatbot.componentFullname" (list $ "keycloak") }}
  labels:
    {{- include "rag-chatbot.labels" $ | nindent 4 }}
    {{- include "rag-chatbot.selectorLabels" (list $ "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-chatbot.selectorLabels" (list $ "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-chatbot.selectorLabels" (list $ "keycloak") | nindent 8 }}
      annotations:
        # Force a rollout when the realm import content changes.
        checksum/realm: {{ $.Files.Get "files/realm-export.json" | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          securityContext:
            {{- include "rag-chatbot.restrictedContainerSecurityContext" $ | nindent 12 }}
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-chatbot.componentFullname" (list $ "secrets") }}
                  key: keycloak-admin-password
            # See values.yaml's keycloak.host comment: this fixes the `iss`
            # claim on issued tokens to the address the browser actually uses.
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.host | quote }}
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "rag-chatbot.componentFullname" (list $ "keycloak-realm") }}
