apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rag-chatbot.componentFullname" (list $ "minio") }}
  labels:
    {{- include "rag-chatbot.labels" $ | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.storage.storageClassName }}
  storageClassName: {{ .Values.minio.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
