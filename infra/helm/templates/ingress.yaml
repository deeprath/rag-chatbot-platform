{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rag-chatbot.fullname" $ }}
  labels:
    {{- include "rag-chatbot.labels" $ | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "kong") }}
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "kong") }}
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "kong") }}
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "kong") }}
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "frontend") }}
                port:
                  number: 80
    - host: {{ .Values.keycloak.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-chatbot.componentFullname" (list $ "keycloak") }}
                port:
                  number: 8080
{{- end }}
