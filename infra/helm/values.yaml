# Default values — tuned for a local single-node cluster (kind/minikube).
# See values-prod.yaml for what changes for a real cloud deployment (that file
# is illustrative, not a drop-in: swap Timescale/MinIO/Keycloak for managed
# equivalents rather than just scaling these templates up).

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  # The app (frontend + /api -> Kong -> backend). Keycloak gets its own host
  # below rather than a path prefix under this one: it has many top-level
  # paths (/realms, /admin, /resources, /js, ...) that would be fragile to
  # enumerate as ingress path rules, so a subdomain is far more robust — the
  # same pattern a real deployment would use (e.g. auth.example.com).
  host: rag-chatbot.local
  annotations: {}
  tls: []

backend:
  image:
    repository: rag-chatbot-backend
    tag: latest
  replicaCount: 1
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
  env:
    environment: dev
    debug: "false"
    llmProvider: anthropic
    anthropicModel: claude-sonnet-5
    openaiModel: gpt-4o-mini
    groqModel: openai/gpt-oss-120b
    corsAllowOrigins: '["http://rag-chatbot.local"]'

frontend:
  image:
    repository: rag-chatbot-frontend
    tag: latest
  replicaCount: 1
  containerPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

kong:
  image:
    repository: kong
    tag: "3.9"
  # Kong/OpenResty defaults to one nginx worker per host CPU core, which on a
  # many-core box vastly overshoots what a low-traffic gateway needs and was
  # enough to get it OOMKilled against a modest memory limit — cap it.
  nginxWorkerProcesses: "2"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

timescaledb:
  image:
    repository: timescale/timescaledb
    tag: latest-pg16
  storage:
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  database: rag_chatbot
  username: rag

minio:
  image:
    repository: minio/minio
    tag: latest
  storage:
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  bucket: documents

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  realm: rag-chatbot
  # Its own ingress host (see the comment on `ingress` above) — also the
  # address stamped into every issued token's `iss` claim (KC_HOSTNAME in the
  # deployment template). The backend is told this same value
  # (KEYCLOAK_ISSUER_URL) to verify tokens, even though it actually *reaches*
  # Keycloak over the internal service address (KEYCLOAK_SERVER_URL). Getting
  # these out of sync breaks every authenticated request with "issuer
  # mismatch" — see infra/README.md.
  host: keycloak.rag-chatbot.local
  publicUrl: http://keycloak.rag-chatbot.local

# Non-secret config lives above; these are *placeholders* for what belongs in
# a real Secret. Override via --set/-f (never commit real values) or, better,
# point this chart at Secrets created by a proper secret manager / External
# Secrets Operator / Sealed Secrets instead of templating them from values at
# all — see infra/helm/README.md.
secrets:
  postgresPassword: "rag"
  minioRootUser: "minioadmin"
  minioRootPassword: "minioadmin"
  keycloakAdminPassword: "admin"
  anthropicApiKey: ""
  openaiApiKey: ""
  groqApiKey: ""
  secretEncryptionKey: ""
