# SonarQube / SonarCloud project config. One project covers both the Python
# backend and the TypeScript frontend — see docs/SECURITY.md for how this
# wires into CI (.github/workflows/security.yml) and what a real SonarQube
# server/token setup looks like (not run in CI here without one configured).

sonar.organization=deeprath
sonar.projectKey=deeprath_rag-chatbot-platform
sonar.projectName=RAG Chatbot Platform
sonar.projectVersion=0.1.0

# Two source trees, one Sonar project.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Anything generated, vendored, or not meant to be analyzed.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/*.min.js,infra/helm/files/**
sonar.coverage.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,backend/alembic/versions/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts

sonar.sourceEncoding=UTF-8
