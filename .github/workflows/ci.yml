name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

      # Integration tests use testcontainers (real TimescaleDB + MinIO
      # containers) — the ubuntu-latest runner's Docker daemon handles this
      # natively, no extra setup needed.
      - name: pytest (unit + integration, with coverage)
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Deliberately removes package-lock.json before installing: npm/cli#4828
      # means a lockfile committed from one platform (ours: macOS) locks in
      # that platform's optional native deps (Rollup's platform binary), and
      # `npm install` with the lockfile still present still honors that
      # resolution rather than re-resolving it for this Linux runner — only
      # removing the lockfile first forces a fresh, platform-correct resolve.
      # Reproduced and verified against a real linux/arm64 container (the
      # failure/fix mechanism is platform-independent); see
      # frontend/Dockerfile's identical workaround/comment for the same bug.
      - name: Install dependencies
        working-directory: frontend
        run: rm -f package-lock.json && npm install

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: vitest (with coverage)
        working-directory: frontend
        run: npm run test:coverage

      - name: build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: helm lint
        working-directory: infra/helm
        run: |
          helm lint --strict . -f values.yaml -f values-dev.yaml
          helm template rag-chatbot . -f values.yaml -f values-dev.yaml > /dev/null
          helm template rag-chatbot . -f values.yaml -f values-prod.yaml > /dev/null
